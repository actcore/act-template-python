_min_copier_version: "9.4.0"
_subdirectory: template
_templates_suffix: .jinja
_skip_if_exists:
  - app.py
  # Author-owned tests: never clobbered by `copier update`. The rest of the
  # e2e harness (conftest.py, pyproject.toml) stays template-owned so fixes
  # to it can still propagate.
  - "e2e/test_*.py"
  - .gitignore
  - act.toml
  - "skill/*"

project_name:
  type: str
  help: Component name (e.g. my-tool)

description:
  type: str
  help: Component description

needs_http:
  type: bool
  default: false
  help: Does this component need outbound HTTP/HTTPS access?

needs_filesystem:
  type: bool
  default: false
  help: Does this component need filesystem access?